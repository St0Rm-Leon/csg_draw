[project]
name = "csg-draw"
version = "0.1.0"
description = "CSG cross-section drawing utilities"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy==2.4.4",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
